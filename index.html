<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID — Play</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="http://52.59.244.144:3001/socket.io/socket.io.js"></script>
</head>
<body>
<div class="app">

<!-- TOPBAR -->
<header class="topbar">
    <div class="logo">
        <span class="logo-mark">V</span>
        <span class="logo-text">VOID</span>
    </div>
    <nav class="navigation">
        <button class="nav-item active">OYNA</button>
        <button class="nav-item">OYUNLAR</button>
        <button class="nav-item">REYTİNQ</button>
    </nav>
    <div class="profile">
        <div class="profile-info">
            <span class="profile-name" id="topbarName">—</span>
            <span class="profile-status">ONLINE</span>
        </div>
        <div class="profile-avatar" id="topbarAvatar">?</div>
        <button class="logout-btn hidden" id="logoutBtn" title="Çıxış">
            <i data-lucide="log-out"></i>
        </button>
    </div>
</header>

<main class="main">

<!-- ═══════════════ JOIN SCREEN ═══════════════ -->
<section class="lobby-view" id="lobbyView">
    <div id="joinScreen">
        <div class="lobby-header">
            <div>
                <span class="eyebrow">PRIVATE PARTY</span>
                <h1>Oyuna<br><span>qoşul.</span></h1>
                <p>Oda yarat və ya mövcud oda kodunu daxil et.</p>
            </div>
        </div>
        <div class="join-form">
            <div class="join-field">
                <label class="join-label">OYUNÇU ADI</label>
                <input type="text" id="playerNameInput" class="join-input"
                    placeholder="adını daxil et..." maxlength="16" autocomplete="off"/>
            </div>
            <div class="join-row">
                <button class="play-button" id="createRoomBtn">
                    <span>ODA YARAT</span><span class="play-arrow">→</span>
                </button>
                <div class="join-or">YA DA</div>
                <div class="join-code-row">
                    <input type="text" id="roomCodeInput" class="join-input join-code-input"
                        placeholder="VOID-XXXX" maxlength="9" autocomplete="off"/>
                    <button class="join-btn" id="joinRoomBtn">QOŞUL</button>
                </div>
            </div>
            <div class="join-error hidden" id="joinError"></div>
        </div>
    </div>

    <!-- ═══════════════ WAITING SCREEN ═══════════════ -->
    <div id="waitingScreen" class="hidden">
        <div class="lobby-header">
            <div>
                <span class="eyebrow">PRIVATE PARTY</span>
                <h1>Komandanı<br><span>gözlə.</span></h1>
                <p>Dostlarına oda kodunu göndər.</p>
            </div>
            <div class="party-code">
                <span>PARTY CODE</span>
                <div class="code-copy-row">
                    <strong id="waitingRoomCode">—</strong>
                    <button class="copy-btn" id="copyCodeBtn" title="Kopyala">
                        <i data-lucide="copy"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Waiting layout: sol=ayarlar, sağ=oyuncu paneli -->
        <div class="waiting-layout">

            <!-- SOL TARAF -->
            <div class="waiting-left">

                <!-- MOD SEÇİMİ — sadece host -->
                <div class="mode-selector hidden" id="modeSelectorWrap">
                    <div class="mode-sel-label">OYUN MODU</div>
                    <div class="mode-sel-btns">
                        <button class="mode-sel-btn active" id="modeClassicBtn" data-mode="classic">
                            <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                            <div><span>KLASSİK</span><small>Puan sistemi · 4 oyunçu</small></div>
                        </button>
                        <button class="mode-sel-btn" id="modeEliminationBtn" data-mode="elimination">
                            <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M10 2l2.4 5h5.2l-4.2 3.1 1.6 5.2L10 12.5l-5 2.8 1.6-5.2L2.4 7h5.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                            <div><span>ELİMİNASYA</span><small>Eleme modu · 12 oyunçu</small></div>
                        </button>
                    </div>
                </div>

                <!-- Klasik: puan ayarı -->
                <div class="room-settings hidden" id="roomSettings">
                    <div class="settings-row">
                        <label class="settings-key">QALIB PUANI</label>
                        <div class="score-picker">
                            <button class="score-btn" id="scoreDown">−</button>
                            <span id="scoreValue">3</span>
                            <button class="score-btn" id="scoreUp">+</button>
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div class="party-status">
                    <div class="status-icon">●</div>
                    <div>
                        <strong id="lobbyStatusText">Gözlənilir...</strong>
                        <span id="lobbyStatusSub">Oyunçuları gözlə</span>
                    </div>
                </div>

                <!-- Aksiyonlar -->
                <div class="lobby-actions">
                    <button class="ready-btn" id="readyBtn">HAZIR DEYİLƏM</button>
                    <button class="play-button hidden" id="startGameBtn">
                        <span>BAŞLA</span><span class="play-arrow">→</span>
                    </button>
                    <button class="solo-btn hidden" id="soloBtn">
                        <span>SOLO ANTRENMAN</span>
                    </button>
                </div>
            </div>

            <!-- SAĞ PANEL -->
            <div class="player-panel">
                <div class="player-panel-header">
                    <span class="player-panel-title">OYUNÇULAR</span>
                    <span class="player-panel-count" id="playerCountLabel">1 / 4</span>
                </div>
                <div class="player-panel-list" id="playerGrid"></div>
            </div>

        </div><!-- /waiting-layout -->

    </div>
</section>

<!-- ═══════════════ GAME VIEW ═══════════════ -->
<section class="timestop-view hidden" id="timestopView"></section>

</main>

<!-- CHAT (overlay — her zaman görünür, oyun sırasında da) -->
<div class="chat-panel" id="chatPanel">
    <div class="chat-header">
        <span class="chat-title">// CHAT</span>
        <button class="chat-toggle" id="chatToggle">
            <i data-lucide="chevron-down"></i>
        </button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
        <input type="text" id="chatInput" class="chat-input"
            placeholder="mesaj yaz..." maxlength="200" autocomplete="off"/>
        <button class="chat-send" id="chatSend">
            <i data-lucide="send"></i>
        </button>
    </div>
</div>

<div class="background-grid"></div>
<div class="background-glow"></div>
</div>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════════════ */
const STORAGE_KEY  = "void_player_name";
const SERVER_URL   = "http://52.59.244.144:3001";

// Stop sesi — bir kez yükle, defalarca çal
const stopSound = new Audio("audio/button music.mp3");
stopSound.volume = 0.6;

const winSound = new Audio("audio/win.mp3");
winSound.volume = 0.7;

function playStopSound() {
    // Aynı ses tekrar tetiklenince baştan başlat
    stopSound.currentTime = 0;
    stopSound.play().catch(() => {}); // autoplay policy hatasını sessizce yut
}

// 13 benzersiz oyuncu rengi — koyu arka plana uygun, birbirinden tamamen farklı tonlar
const PLAYER_COLORS = [
    "#00e87a",  // 0  parlak yeşil
    "#3b9eff",  // 1  mavi
    "#ff8c00",  // 2  turuncu
    "#ff3344",  // 3  kırmızı
    "#e040fb",  // 4  mor
    "#00d4ff",  // 5  cyan
    "#ffd700",  // 6  altın sarısı
    "#ff6eb4",  // 7  pembe
    "#7fff00",  // 8  lime yeşil
    "#ff4500",  // 9  kızıl turuncu
    "#40e0d0",  // 10 turkuaz
    "#bf5fff",  // 11 lavanta
    "#ff9a3c",  // 12 amber
];

/** Odada kullanılmayan ilk rengi döner */
function getAvailableColor(usedColors) {
    return PLAYER_COLORS.find(c => !usedColors.includes(c)) ?? PLAYER_COLORS[0];
}

/** Oyuncunun rengini döner — önce server'dan gelen color, yoksa index bazlı */
function playerColor(nameOrIndex) {
    if (typeof nameOrIndex === "number") return PLAYER_COLORS[nameOrIndex % PLAYER_COLORS.length];
    const p = S.players.find(x => x.name === nameOrIndex);
    if (p?.color) return p.color;
    const idx = S.players.findIndex(x => x.name === nameOrIndex);
    return PLAYER_COLORS[idx >= 0 ? idx % PLAYER_COLORS.length : 0];
}

/* ════════════════════════════════════════════════════════════
   APP STATE
════════════════════════════════════════════════════════════ */
const S = {
    myName:       "",
    roomCode:     "",
    isHost:       false,
    gameMode:     "classic",
    winScore:     3,
    activePlayers: [],
    round:     0,
    target:    0,
    players:   [],
    running:   false,
    startTime: 0,
    elapsed:   0,
    rafId:     null,
    keyHandler:null,
};

/* ════════════════════════════════════════════════════════════
   SOCKET
════════════════════════════════════════════════════════════ */
let socket;
try {
    socket = io(SERVER_URL, { autoConnect: true, reconnectionAttempts: 5 });
} catch(e) {
    socket = { emit:()=>{}, on:()=>{}, connected: false };
    console.warn("Socket.io yüklənmədi — offline mod");
}

/* ════════════════════════════════════════════════════════════
   DOM REFS
════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const lobbyView      = $("lobbyView");
const joinScreen     = $("joinScreen");
const waitingScreen  = $("waitingScreen");
const timestopView   = $("timestopView");
const joinError      = $("joinError");
const playerGrid     = $("playerGrid");
const playerCountLbl = $("playerCountLabel");
const waitingCode    = $("waitingRoomCode");
const lobbyStatus    = $("lobbyStatusText");
const lobbyStatusSub = $("lobbyStatusSub");
const startGameBtn   = $("startGameBtn");
const readyBtn       = $("readyBtn");
const soloBtn        = $("soloBtn");
const roomSettings   = $("roomSettings");
const scoreValue     = $("scoreValue");
const topbarName     = $("topbarName");
const topbarAvatar   = $("topbarAvatar");
const logoutBtn      = $("logoutBtn");
const chatPanel      = $("chatPanel");
const chatMessages   = $("chatMessages");
const chatInput      = $("chatInput");

/* ════════════════════════════════════════════════════════════
   PERSISTENCE — isim tarayıcı kapanana kadar tutulur
════════════════════════════════════════════════════════════ */
function loadSavedName() {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) {
        $("playerNameInput").value = saved;
        // Otomatik oda ekranına geçme — kullanıcı hâlâ girmeyi onaylamalı
    }
}

function saveName(name) {
    sessionStorage.setItem(STORAGE_KEY, name);
}

function clearName() {
    sessionStorage.removeItem(STORAGE_KEY);
}

/* ════════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════════ */
function showError(msg) {
    joinError.textContent = msg;
    joinError.classList.remove("hidden");
    setTimeout(() => joinError.classList.add("hidden"), 4000);
}

function updateTopbar(name) {
    topbarName.textContent   = name;
    topbarAvatar.textContent = name && name !== "—" ? name.charAt(0).toUpperCase() : "?";
    logoutBtn.style.display  = name && name !== "—" ? "grid" : "none";
}

/** Süre farkını okunabilir formatta döner */
/** Süre farkını arrow + 2 decimal ile göster */
function diffLabel(diff) {
    const arrowSvg = `<svg class="diff-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
    if (diff < 0.001) return `${arrowSvg}<span>0.00s</span>`;
    return `${arrowSvg}<span>${diff.toFixed(2)}s</span>`;
}

/** Farka göre renk sınıfı */
function diffClass(diff) {
    if (diff < 0.001) return "diff-perfect";
    if (diff < 0.1)   return "diff-great";
    if (diff < 0.3)   return "diff-ok";
    return "diff-bad";
}

function dotsHtml(score, max) {
    return Array.from({ length: max }, (_, i) =>
        `<span class="ts-score-dot ${i < score ? "ts-dot-filled" : ""}"></span>`
    ).join("");
}

function dotsHtmlColored(score, max, color) {
    return Array.from({ length: max }, (_, i) =>
        `<span class="ts-score-dot" style="${i < score ? `background:${color};border-color:${color}` : ""}"></span>`
    ).join("");
}

/**
 * N oyuncu için daire çevresindeki pozisyonları hesaplar.
 * Kendim her zaman alta (270°) yerleşir, diğerleri eşit aralıklarla.
 * @param {number} total   — toplam aktif oyuncu sayısı
 * @param {number} myIndex — kendi sıram (0 = alta)
 * @param {number} radius  — daireden uzaklık (%)
 * returns { x, y, angle }[]
 */
function calcSeatPositions(total, myIndex, radius) {
    const positions = [];
    // CSS koordinat sistemi: Y aşağıya büyür
    // Ben altta olacaksam startAngle = 90° (sin(90°)=1 → y pozitif → aşağı)
    const startAngle = 90;
    for (let i = 0; i < total; i++) {
        const angle = (startAngle + (360 / total) * i) % 360;
        const rad   = (angle * Math.PI) / 180;
        // Eliptik — yatayda biraz daha geniş
        const rx = radius * 0.90;
        const ry = radius * 0.75;
        const x  = Math.cos(rad) * rx;
        const y  = Math.sin(rad) * ry;
        positions.push({ x, y, angle });
    }
    return positions;
}

/**
 * Oyuncu sayısına göre masa SVG'sini döner.
 * @param {number} count — aktif oyuncu sayısı
 */
function masaImg(count) {
    const map = {
        1: "img/masa/1 kisilik test.svg",
        2: "img/masa/2 li masa.svg",
        3: "img/masa/3 lu masa.svg",
        4: "img/masa/4 lu masa.svg",
    };
    const src = map[count] || map[4];
    return `<img src="${src}" class="ts-masa-img" alt="masa" draggable="false">`;
}

/* ════════════════════════════════════════════════════════════
   WAITING SCREEN
════════════════════════════════════════════════════════════ */
function showWaitingScreen(room) {
    S.roomCode = room.code;
    S.winScore = room.winScore;
    S.gameMode = room.gameMode || "classic";
    S.isHost   = room.players.find(p => p.name === S.myName)?.isHost ?? false;

    // Kendi rengim yoksa, odada kullanılmayan ilk rengi al ve sunucuya bildir
    const myPlayer = room.players.find(p => p.name === S.myName);
    if (!myPlayer?.color) {
        const usedColors = room.players.filter(p => p.name !== S.myName).map(p => p.color).filter(Boolean);
        const myColor = getAvailableColor(usedColors);
        socket.emit("player:color", { color: myColor });
    }

    saveName(S.myName);
    updateTopbar(S.myName);

    joinScreen.classList.add("hidden");
    waitingScreen.classList.remove("hidden");
    chatPanel.classList.remove("hidden-chat");
    lobbyView.classList.remove("hidden");
    timestopView.classList.add("hidden");

    if (S.isHost) {
        $("modeSelectorWrap").classList.remove("hidden");
        roomSettings.classList.toggle("hidden", S.gameMode !== "classic");
        startGameBtn.classList.remove("hidden");
        soloBtn.classList.remove("hidden");
        scoreValue.textContent = room.winScore;
    }

    updateWaiting(room);
}

function updateWaiting(room) {
    S.winScore  = room.winScore;
    S.gameMode  = room.gameMode;
    scoreValue.textContent     = room.winScore;
    const activePlayersCount = room.players.filter(p => !p.hasLeft).length;
    playerCountLbl.textContent = `${activePlayersCount} / ${room.maxPlayers}`;
    waitingCode.textContent    = room.code;

    S.isHost = room.players.find(p => p.name === S.myName)?.isHost ?? false;

    if (S.isHost) {
        $("modeSelectorWrap").classList.remove("hidden");
        roomSettings.classList.toggle("hidden", room.gameMode !== "classic");
        startGameBtn.classList.remove("hidden");
        soloBtn.classList.remove("hidden");
        readyBtn.classList.add("hidden");

        // Mod buton aktif durumu
        $("modeClassicBtn").classList.toggle("active", room.gameMode === "classic");
        $("modeEliminationBtn").classList.toggle("active", room.gameMode === "elimination");

        // 4'ten fazla oyuncu varsa classic seçilemiyor — ayrılanları sayma
        const activePlayerCount = room.players.filter(p => !p.hasLeft).length;
        const classicDisabled = activePlayerCount > 4;
        $("modeClassicBtn").disabled = classicDisabled;
        $("modeClassicBtn").style.opacity = classicDisabled ? ".35" : "";
        $("modeClassicBtn").title = classicDisabled ? "Klassik mod maksimum 4 oyunçu üçündür" : "";
    } else {
        readyBtn.classList.remove("hidden");
        const myPlayer = room.players.find(p => p.name === S.myName);
        if (myPlayer?.isReady) {
            readyBtn.textContent = "HAZIRDI ✓";
            readyBtn.classList.add("is-ready");
        } else {
            readyBtn.textContent = "HAZIR DEYİLƏM";
            readyBtn.classList.remove("is-ready");
        }
    }

    const usedColors = room.players.map(p => p.color).filter(Boolean);

    // SAĞ PANEL — oyuncu listesi (kart değil, satır) — ayrılanları gösterme
    const maxSlots = room.maxPlayers;
    playerGrid.innerHTML = room.players.filter(p => !p.hasLeft).map((p, i) => {
        const isSelf  = p.name === S.myName;
        const color   = p.color || PLAYER_COLORS[i % PLAYER_COLORS.length];
        const isReady = p.isHost || p.isReady;
        const inLobby = p.inLobby !== false; // undefined olsa da true say
        return `
        <div class="pp-player ${isSelf ? "pp-self" : ""} ${isReady ? "pp-ready" : ""} ${!inLobby ? "pp-waiting-lobby" : ""}">
            <div class="pp-avatar" style="background:${color}20; border-color:${color}40; color:${color}">
                ${p.name.charAt(0).toUpperCase()}
            </div>
            <div class="pp-info">
                <span class="pp-name ${isSelf ? "pp-name-clickable" : ""}"
                      style="${isSelf ? `color:${color};cursor:pointer` : ""}"
                      ${isSelf ? `onclick="openColorPicker(event)"` : ""}>
                    ${p.name}${isSelf ? " ✎" : ""}
                </span>
                <span class="pp-tag">${p.isHost ? "HOST" : isSelf ? "SƏN" : "OYUNÇU"}</span>
            </div>
            <div class="pp-color-dot" style="background:${color};box-shadow:0 0 8px ${color}60"></div>
            <div class="pp-status ${isReady ? "pp-status-ready" : ""}">
                ${!inLobby 
                    ? `<div class="pp-spinner"></div>` 
                    : isReady
                        ? `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8l4 4 6-6" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
                        : `<span class="pp-dot"></span>`
                }
            </div>
        </div>`;
    }).join("");

    // Boş slotlar — ayrılanların yerine değil, aktif oyuncu sayısına göre
    const activePlayersCount2 = room.players.filter(p => !p.hasLeft).length;
    for (let i = activePlayersCount2; i < maxSlots; i++) {
        playerGrid.innerHTML += `
        <div class="pp-player pp-empty">
            <div class="pp-avatar pp-avatar-empty">+</div>
            <div class="pp-info"><span class="pp-name pp-name-empty">Boş slot</span></div>
        </div>`;
    }

    // Status — ayrılanları sayma
    const nonHost     = room.players.filter(p => !p.isHost && !p.hasLeft);
    const readyCount  = nonHost.filter(p => p.isReady).length;
    const allReady    = nonHost.length === 0 || readyCount === nonHost.length;
    const activePlayersCount3 = room.players.filter(p => !p.hasLeft).length;

    if (activePlayersCount3 < 2) {
        lobbyStatus.textContent    = "Ən az 2 oyunçu lazımdır";
        lobbyStatusSub.textContent = `${activePlayersCount3}/2 qoşulub`;
    } else if (!allReady) {
        lobbyStatus.textContent    = "Oyunçular hazır deyil";
        lobbyStatusSub.textContent = `${readyCount}/${nonHost.length} hazır`;
    } else {
        lobbyStatus.textContent    = "Hazır! Host başladacaq";
        lobbyStatusSub.textContent = `${room.gameMode === "elimination" ? "Eleme modu" : "Klassik mod"} · ${activePlayersCount3} oyunçu`;
    }

    startGameBtn.disabled = activePlayersCount3 < 2 || !allReady;
}

/* ════════════════════════════════════════════════════════════
   CHAT
════════════════════════════════════════════════════════════ */
let chatOpen = true;

/* ════════════════════════════════════════════════════════════
   COLOR PICKER
════════════════════════════════════════════════════════════ */
function openColorPicker(e) {
    e.stopPropagation();
    // Varsa eski picker'ı kapat
    document.getElementById("colorPickerPopup")?.remove();

    // Room.players-dan yoxsa S.players-dan götür
    const allPlayers = (typeof updateWaiting !== 'undefined' && waitingScreen && !waitingScreen.classList.contains('hidden'))
        ? Array.from(document.querySelectorAll('.pp-player')).map(el => {
            const nameEl = el.querySelector('.pp-name');
            const dotEl = el.querySelector('.pp-color-dot');
            if (!nameEl || !dotEl) return null;
            const name = nameEl.textContent.replace(' ✎', '').trim();
            const color = dotEl.style.background;
            return { name, color };
        }).filter(Boolean)
        : S.players;

    const usedColors = allPlayers
        .filter(p => p.name !== S.myName && p.color)
        .map(p => p.color)
        .filter(Boolean);

    const myColor = allPlayers.find(p => p.name === S.myName)?.color || PLAYER_COLORS[0];

    const swatches = PLAYER_COLORS.map(c => {
        const inUse = usedColors.includes(c);
        return `<button class="color-swatch ${inUse ? "color-swatch-used" : ""} ${c === myColor ? "color-swatch-active" : ""}"
                        style="background:${c}" data-color="${c}"
                        ${inUse ? "disabled title='İstifadə olunur'" : ""}></button>`;
    }).join("");

    const popup = document.createElement("div");
    popup.id = "colorPickerPopup";
    popup.className = "color-picker-popup";
    popup.innerHTML = `
        <div class="color-picker-label">RƏNGİNİ SEÇ</div>
        <div class="color-swatches">${swatches}</div>`;

    // Tıklanan elementin yanına yerleştir
    const rect = e.target.getBoundingClientRect();
    popup.style.top  = `${rect.bottom + 8}px`;
    popup.style.left = `${rect.left}px`;
    document.body.appendChild(popup);

    popup.querySelectorAll(".color-swatch:not(:disabled)").forEach(btn => {
        btn.addEventListener("click", () => {
            socket.emit("player:color", { color: btn.dataset.color });
            popup.remove();
        });
    });

    // Dışarı tıklayınca kapat
    setTimeout(() => {
        document.addEventListener("click", () => popup.remove(), { once: true });
    }, 10);
}

function appendChat(name, message, type = "normal") {
    const div = document.createElement("div");
    div.className = `chat-msg chat-${type}`;
    if (type === "system" || type === "leave") {
        div.innerHTML = `<span class="chat-sys">${escapeHtml(message)}</span>`;
    } else {
        const isSelf = name === S.myName;
        div.innerHTML = `
            <span class="chat-name ${isSelf ? "chat-self" : ""}">${escapeHtml(name)}</span>
            <span class="chat-text">${escapeHtml(message)}</span>`;
    }
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#x27;")
        .replace(/\//g,"&#x2F;");
}

function sanitizeName(name) {
    // Yalnız a-z, A-Z, 0-9, Azərbaycan hərfləri
    return name.replace(/[^a-zA-Z0-9əşıöüçğƏŞİÖÜÇĞ\s\-_]/g, '').trim();
}

function validateName(name) {
    const sanitized = sanitizeName(name);
    if (!sanitized) return { valid: false, error: "Ad yalnız hərf və rəqəmlərdən ibarət ola bilər" };
    if (sanitized.length < 2) return { valid: false, error: "Ad ən az 2 simvol olmalıdır" };
    if (sanitized.length > 16) return { valid: false, error: "Ad maksimum 16 simvol ola bilər" };
    return { valid: true, name: sanitized };
}

        if (p) p.readyForNext = sc.readyForNext;
    });
    
    // Scoreboard-u update et (kaybolmasın)

        if (readyCounter) {
            readyCounter.textContent = `${readyCount}/${totalActive} HAZIR`;

        // Her row-u güncelle
        activeScores.forEach(playerData => {
            const isReady = playerData.readyForNext;

            const rows = resultList.querySelectorAll(".ts-result-row");

   GAME UI — COUNTDOWN

function renderCountdown(count) {
    if (count === 3) {
        // İlk tik — sahneyi oluştur
        lobbyView.classList.add("hidden");
        timestopView.classList.remove("hidden");

        const myIdx = S.players.findIndex(p => p.name === S.myName);
        const reord = myIdx >= 0
            ? [S.players[myIdx], ...S.players.filter(p => p.name !== S.myName)]
            : S.players;

        const activeReord = reord.filter(p => !p.isEliminated);
        const radius = 36;
        const positions = calcSeatPositions(activeReord.length, 0, radius);

        const seats = activeReord.map((p, i) => {
            const origIdx  = S.players.indexOf(p);
            const colorIdx = origIdx >= 0 ? origIdx : i;
            const pos      = positions[i];
            return `
            <div class="ts-seat ts-seat-circle player-color-${colorIdx}"
                 style="left:calc(50% + ${pos.x.toFixed(1)}%); top:calc(50% + ${pos.y.toFixed(1)}%); transform:translate(-50%,-50%)">
                <i data-lucide="armchair" class="ts-chair-icon ts-chair-idle"></i>
                <div class="ts-seat-name ${p.name===S.myName?"ts-name-self":""}">${p.name}</div>
            </div>`}).join("");

        timestopView.innerHTML = `
            <div class="ts-table-scene" id="tsScene">
                ${seats}
                <div class="ts-table-center ts-table-countdown">
                    ${masaImg(S.players.length)}
                    <span class="ts-eyebrow">TIME STOP</span>
                    <div class="ts-countdown-num ts-pop" id="tsCountNum" style="color:var(--red)">${count}</div>
                    <div class="ts-countdown-label">hazırlaşın...</div>
                </div>
            </div>`;
        lucide.createIcons();
        return;
    }

    const el = $("tsCountNum");
    if (!el) return;
    el.classList.remove("ts-pop");
    void el.offsetWidth;
    if (count > 0) {
        el.textContent = count;
        el.style.color = "var(--red)";
    } else {
        el.textContent = "BAŞLA";
        el.style.color = "var(--green)";
        $("tsScene")?.classList.add("ts-go-flash");
    }
    el.classList.add("ts-pop");
}

/* ════════════════════════════════════════════════════════════
   GAME UI — ROUND
════════════════════════════════════════════════════════════ */
function renderRound() {
    const myIndex   = S.players.findIndex(p => p.name === S.myName);
    const reordered = myIndex >= 0
        ? [S.players[myIndex], ...S.players.filter(p => p.name !== S.myName)]
        : S.players;

    // Ayrılanları ve elenenları filtrele
    const activeReordered = reordered.filter(p => !p.isEliminated && !p.hasLeft);
    const isSolo = activeReordered.length === 1;

    // Daire çevresine eşit aralıklı yerleşim
    const radius    = 36;
    const positions = calcSeatPositions(activeReordered.length, 0, radius);

    const seats = activeReordered.map((p, i) => {
        const self     = p.name === S.myName;
        const origIdx  = S.players.indexOf(p);
        const colorIdx = origIdx >= 0 ? origIdx : i;
        const pos      = positions[i];
        return `
        <div class="ts-seat ts-seat-circle player-color-${colorIdx}" data-name="${p.name}"
             style="left:calc(50% + ${pos.x.toFixed(1)}%); top:calc(50% + ${pos.y.toFixed(1)}%); transform:translate(-50%,-50%)">
            <i data-lucide="armchair" class="ts-chair-icon${self?" chair-self":""}"></i>
            ${S.gameMode !== "elimination" ? `<div class="ts-seat-score">${dotsHtml(p.score, S.winScore)}</div>` : ""}
            <div class="ts-seat-name ${self?"ts-name-self":""}">${self?"SƏN · ":""}${p.name}</div>
            <button class="ts-stop-btn ${self?"ts-btn-self":"ts-btn-other"}" data-name="${p.name}"
                    ${self?"":"disabled"}>
                <svg viewBox="0 0 64 64" fill="none" class="ts-btn-svg">
                    <rect x="18" y="18" width="28" height="28" rx="5" fill="white"/>
                </svg>
            </button>
            <div class="ts-seat-result hidden" data-res="${p.name}"></div>
        </div>`;
    }).join("");

    const spectators    = S.players.filter(p => p.isEliminated && !p.hasLeft); // ayrılanları gösterme
    const spectatorHtml = spectators.length ? `
        <div class="spectator-bar" id="spectatorBar">
            <div class="spectator-bar-title">SEYİRÇİLƏR</div>
            <div class="spectator-list">
                ${spectators.map(p => {
                    const color = playerColor(p.name);
                    return `
                    <div class="spectator-item">
                        <div class="spectator-avatar" style="background:${color}20;color:${color}">
                            ${p.name.charAt(0).toUpperCase()}
                        </div>
                        <span class="spectator-name">${p.name}</span>
                        <span class="spectator-elim-round">TUR ${p.elimRound ?? "?"}</span>
                    </div>`;
                }).join("")}
            </div>
        </div>` : "";

    timestopView.innerHTML = `
        <div class="ts-game-header">
            <button class="ts-back-btn" id="tsBackBtn">← GERİ</button>
            <span class="ts-eyebrow">TIME STOP — TUR ${S.round}</span>
            <span class="ts-eyebrow" style="color:var(--muted)">
                ${isSolo ? "ANTRENMAN" : S.gameMode === "elimination" ? `SON ${activeReordered.length} QALDI` : `İLK ${S.winScore} QALIB`}
            </span>
        </div>
        <div class="ts-table-scene ts-scene-game" id="tsScene"
             style="${spectators.length ? "margin-right:200px" : ""}">
            ${seats}
            <div class="ts-table-surface">
                <div class="ts-table-center">
                    <span class="ts-target-label">HƏDƏF</span>
                    <div class="ts-target-time">${S.target.toFixed(2)}<span class="ts-unit">s</span></div>
                    <div class="ts-table-hint">düymənə bas</div>
                </div>
            </div>
        </div>
        ${spectatorHtml}
        <div class="mobile-stop-bar" id="mobileStopBar">
            <button class="mobile-stop-btn player-color-0" id="mobileStopBtn"
                    style="background: var(--player-color)">
                <svg viewBox="0 0 64 64" fill="none" style="width:34px;height:34px">
                    <rect x="18" y="18" width="28" height="28" rx="5" fill="white"/>
                </svg>
                <span>DURDUR</span>
            </button>
        </div>`;

    lucide.createIcons();

    // Mobil stop bar rengini kendi oyuncuya göre ayarla
    const myOrigIdx  = S.players.findIndex(p => p.name === S.myName);
    const myColorIdx = myOrigIdx >= 0 ? myOrigIdx : 0;
    const mobileBtn  = $("mobileStopBtn");
    if (mobileBtn) {
        mobileBtn.className = `mobile-stop-btn player-color-${myColorIdx}`;
        mobileBtn.style.background = `var(--player-color)`;
    }

    $("tsBackBtn").addEventListener("click", () => {
        cancelAnimationFrame(S.rafId);
        document.removeEventListener("keydown", S.keyHandler);
        S.running = false;
        timestopView.classList.add("hidden");
        lobbyView.classList.remove("hidden");
    });

    // Masadaki buton (tablet/desktop)
    document.querySelector(`.ts-btn-self`)
        ?.addEventListener("click", () => sendStop());

    // Mobil alt bar butonu
    $("mobileStopBtn")?.addEventListener("click", () => sendStop());

    S.keyHandler = e => {
        if ((e.code === "Space" || e.code === "Enter") && S.running) {
            e.preventDefault();
            sendStop();
        }
    };
    document.addEventListener("keydown", S.keyHandler);

    // Client-side AFK guard: target + 10s geçerse oto-stop
    const afkMs = (S.target + 10) * 1000;
    const afkTimer = setTimeout(() => {
        if (S.running) {
            console.log("[AFK] Oto-stop tetiklendi");
            sendStop();
        }
    }, afkMs);

    // RAF loop — sadece elapsed için
    S.startTime = performance.now();
    (function loop(now) {
        if (!S.running) { clearTimeout(afkTimer); return; }
        S.elapsed = (now - S.startTime) / 1000;
        S.rafId   = requestAnimationFrame(loop);
    })(performance.now());
}

function sendStop() {
    if (!S.running) return;
    S.running = false;
    document.removeEventListener("keydown", S.keyHandler);

    const elapsed = (performance.now() - S.startTime) / 1000;

    playStopSound();

    // Masadaki buton
    const btn = document.querySelector(".ts-btn-self");
    if (btn) {
        btn.disabled = true;
        btn.classList.add("ts-stopped");
        btn.innerHTML = stopSvg("check");
    }

    // Mobil bar butonu
    const mBtn = $("mobileStopBtn");
    if (mBtn) {
        mBtn.disabled = true;
        mBtn.classList.add("mobile-stop-done");
        mBtn.innerHTML = `
            <svg viewBox="0 0 64 64" fill="none" style="width:36px;height:36px">
                <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2.5"/>
                <polyline points="20,34 28,42 44,24" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span>${elapsed.toFixed(2)}s</span>`;
    }

    // Kendi zamanını göster
    const res = document.querySelector(`.ts-seat-result[data-res="${S.myName}"]`);
    if (res) { res.textContent = elapsed.toFixed(2)+"s"; res.classList.remove("hidden"); }

    socket.emit("game:stop", { code: S.roomCode, stoppedAt: elapsed });
}

function markStopped(name) {
    if (name === S.myName) return;
    const btn = document.querySelector(`.ts-stop-btn[data-name="${name}"]`);
    if (btn) {
        btn.classList.add("ts-stopped");
        btn.innerHTML = stopSvg("waiting");
    }
}

function stopSvg(type) {
    if (type === "check") return `
        <svg viewBox="0 0 64 64" fill="none" class="ts-btn-svg">
            <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2.5"/>
            <polyline points="20,34 28,42 44,24" stroke="currentColor" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>`;
    return `
        <svg viewBox="0 0 64 64" fill="none" class="ts-btn-svg">
            <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2.5"/>
            <rect x="24" y="24" width="16" height="16" fill="currentColor" opacity=".4"/>
        </svg>`;
}

/* ════════════════════════════════════════════════════════════
   GAME UI — ROUND RESULT
════════════════════════════════════════════════════════════ */
function renderRoundResult({ round, target, tied, winner, isPerfect, eliminated, results, scores, remaining, gameMode, isGameOver, champion }) {
    const scoreMap   = Object.fromEntries(scores.map(p => [p.name, p.score]));
    const isElimMode = (gameMode || S.gameMode) === "elimination";

    // Ready count hesapla
    const activeScores = scores.filter(p => !p.isEliminated && !p.hasLeft);
    const readyCount = activeScores.filter(p => p.readyForNext).length;
    const totalActive = activeScores.length;

    const rows = results.map((p, i) => {
        const isWin  = !tied && p.name === winner;
        const isElim = p.name === eliminated;
        const score  = scoreMap[p.name] ?? 0;
        const isSelf = p.name === S.myName;
        const color  = playerColor(p.name);
        const hasLeft = S.players.find(pl => pl.name === p.name)?.hasLeft || false;
        const playerData = scores.find(sc => sc.name === p.name);
        const isReady = playerData?.readyForNext || false;

        // Elimination modda puan/badge yok
        const ptsIcon = (!isElimMode && isWin) ? (isPerfect
            ? `<span class="pts-badge" style="background:${color}20;color:${color}">
                <svg viewBox="0 0 16 16" fill="none"><path d="M8 2l1.8 3.6L14 6.3l-3 2.9.7 4.1L8 11.4l-3.7 1.9.7-4.1-3-2.9 4.2-.7z" fill="currentColor"/></svg>+2
               </span>`
            : `<span class="pts-badge" style="background:${color}20;color:${color}">
                <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>+1
               </span>`)
            : "";

        const readyIcon = isReady && !isGameOver ? `<span class="ready-check" style="color:${color}">✓</span>` : "";

        const leftBorder = isElim ? "var(--red)"
            : isWin ? color
            : tied && i === 0 ? "var(--yellow)"
            : "rgba(255,255,255,.07)";

        const selfStyle = isSelf
            ? `background:${color}10; outline: 1px solid ${color}30; outline-offset:-1px;`
            : "";

        return `
        <div class="ts-result-row"
             style="border-left: 3px solid ${leftBorder}; opacity:${isElim?.5:1}; ${selfStyle}">
            <div class="ts-rr-player">
                <span class="ts-rr-dot" style="background:${color}; box-shadow:0 0 6px ${color}80"></span>
                <span class="ts-rr-name" style="color:${color}; font-weight:${isSelf?800:600}">
                    ${p.name}${isElim?" ⚡":""}${hasLeft?" (ayrıldı)":""}
                </span>
            </div>
            <span class="ts-rr-time" style="color:${color}">${p.time.toFixed(2)}s</span>
            <span class="ts-rr-diff">${diffLabel(p.diff)}</span>
            ${!isElimMode ? `<div class="ts-rr-score">${dotsHtmlColored(score, S.winScore, color)}</div>` : ""}
            ${ptsIcon}
            ${readyIcon}
        </div>`;
    }).join("");

    const tieNote     = tied ? `<div class="ts-tie-note">Bərabərlik — ${isElimMode ? "heç kim silinmədi" : "xal verilmədi"}</div>` : "";
    const elimNote    = eliminated ? `<div class="ts-elim-note" style="border-color:var(--red)">⚡ ${eliminated} VURULDU</div>` : "";
    const perfectNote = isPerfect && !tied && !isElimMode ? `<div class="ts-perfect-note">⭐ PERFECT +2 XAL!</div>` : "";
    const isSolo      = S.players.length === 1;

    const myPlayerData = scores.find(p => p.name === S.myName);
    const iAmReady = myPlayerData?.readyForNext || false;

    if (isGameOver) {
        // Oyun bitti — final scoreboard sadə
        timestopView.innerHTML = `
            <div class="ts-wrap">
                <span class="ts-eyebrow">TUR ${round} — OYUN BİTDİ</span>
                <div class="ts-target-box">
                    <span class="ts-target-label">SON TUR HƏDƏF</span>
                    <div class="ts-target-time">${target.toFixed(2)}<span class="ts-unit">s</span></div>
                </div>
                ${perfectNote}${tieNote}${elimNote}
                <div class="ts-results-list">${rows}</div>
                <button class="ts-next-btn" id="tsGoLobby" style="margin-top:20px">LOBBYƏ QAYIT</button>
                <div class="progress-bar-wrap">
                    <div class="progress-bar" id="autoProgressBar"></div>
                </div>
                <div class="ts-wait-note">Auto lobby (7-9s)</div>
            </div>`;
        
        $("tsGoLobby")?.addEventListener("click", () => {
            // Yalnız özüm dönürəm
            timestopView.classList.add("hidden");
            lobbyView.classList.remove("hidden");
            waitingScreen.classList.remove("hidden");
            joinScreen.classList.add("hidden");
            
            // Server-a bildir
            socket.emit("player:returned_lobby", { code: S.roomCode });
        });
        
        // Progress bar animation
        startAutoProgress("autoProgressBar", 7000 + Math.random() * 2000);
        return;
    }

    timestopView.innerHTML = `
        <div class="ts-wrap">
            <span class="ts-eyebrow">TUR ${round} — NƏTİCƏ</span>
            <div class="ts-target-box">
                <span class="ts-target-label">HƏDƏF VAXT</span>
                <div class="ts-target-time">${target.toFixed(2)}<span class="ts-unit">s</span></div>
            </div>
            ${perfectNote}${tieNote}${elimNote}
            <div class="ts-results-list" id="resultList">${rows}</div>
            ${isSolo
                ? `<button class="ts-next-btn" id="tsNextBtn">NÖVBƏTİ TUR →</button>
                   <button class="ts-back-btn2" id="tsExitSolo">ÇIXIŞ</button>`
                : `<button class="ts-next-btn ${iAmReady?"ts-btn-ready":""}" id="tsNextBtn">${iAmReady?"HAZIR ✓":"NÖVBƏTİ TUR →"}</button>
                   <div class="ready-counter">${readyCount}/${totalActive} HAZIR</div>
                   <div class="progress-bar-wrap">
                       <div class="progress-bar" id="autoProgressBar"></div>
                   </div>
                   <div class="ts-wait-note">Auto başlama (7-9s)</div>`
            }
        </div>`;

    $("tsNextBtn")?.addEventListener("click", () => {
        if (isSolo) {
            startSoloRound();
        } else if (!iAmReady) {
            socket.emit("game:next_round", { code: S.roomCode });
            $("tsNextBtn").disabled = true;
            $("tsNextBtn").classList.add("ts-btn-ready");
            $("tsNextBtn").textContent = "HAZIR ✓";
        }
    });
    
    $("tsExitSolo")?.addEventListener("click", () => {
        S.running = false;
        timestopView.classList.add("hidden");
        lobbyView.classList.remove("hidden");
    });
    
    // Progress bar animation
    if (!isSolo) {
        startAutoProgress("autoProgressBar", 7000 + Math.random() * 2000);
    }
}

function startAutoProgress(barId, duration) {
    const bar = document.getElementById(barId);
    if (!bar) return;
    
    bar.style.transition = `width ${duration}ms linear`;
    bar.style.width = "0%";
    
    setTimeout(() => {
        bar.style.width = "100%";
    }, 50);
}

/* ════════════════════════════════════════════════════════════
   GAME UI — FINAL
════════════════════════════════════════════════════════════ */
function renderFinal({ champion, finalScores }) {
    // Ayrılanları filtrele
    const activeScores = finalScores.filter(p => {
        const player = S.players.find(pl => pl.name === p.name);
        return !player?.hasLeft;
    });
    
    const podium = activeScores.map((p, i) => {
        const isSelf  = p.name === S.myName;
        const color   = playerColor(p.name);
        const isChamp = i === 0;
        return `
        <div class="ts-podium-row" style="border-left: 3px solid ${color}">
            <span class="ts-pod-rank" style="color:${color}">${isChamp ? "👑" : "#"+(i+1)}</span>
            <div style="display:flex;align-items:center;gap:8px">
                <span class="ts-rr-dot" style="background:${color}"></span>
                <span class="ts-pod-name" style="${isSelf?`color:${color};font-weight:800`:""}">${p.name}${isSelf?" ◀":""}</span>
            </div>
            <div class="ts-pod-dots">${dotsHtmlColored(p.score, S.winScore, color)}</div>
            <span class="ts-pod-diff" style="color:${color}">${p.score} XAL</span>
        </div>`;
    }).join("");

    const isSelf      = champion === S.myName;
    if (isSelf) { winSound.currentTime = 0; winSound.play().catch(()=>{}); }
    const champColor  = playerColor(champion);
    const winnerClass = isSelf ? "ts-winner-box ts-winner-self" : "ts-winner-box";

    timestopView.innerHTML = `
        <div class="ts-wrap ts-final-wrap">
            <span class="ts-eyebrow">TIME STOP — OYUN BİTDİ</span>
            <div class="${winnerClass}" style="border-color:${champColor}40;background:${champColor}08">
                <div class="ts-winner-crown">${isSelf ? "👑" : "🏆"}</div>
                <div class="ts-winner-name" style="color:${champColor}">${champion}</div>
                <div class="ts-winner-sub" style="color:${champColor}aa">${isSelf ? "SƏN QAZANDIN!" : "QALİB"}</div>
            </div>
            <div class="ts-results-list" style="margin-top:24px">${podium}</div>
            <div class="ts-final-actions">
                <button class="ts-back-btn2" id="tsGoLobby">LOBBYƏ QAYIT</button>
            </div>
        </div>`;

    $("tsGoLobby")?.addEventListener("click", () => {
        timestopView.classList.add("hidden");
        lobbyView.classList.remove("hidden");
        waitingScreen.classList.remove("hidden");
        joinScreen.classList.add("hidden");
        
        // Server-a bildir
        socket.emit("game:return_lobby", { code: S.roomCode });
    });
}

function renderAborted(reason) {
    timestopView.innerHTML = `
        <div class="ts-wrap" style="margin-top:100px">
            <span class="ts-eyebrow">OYUN DAYANDI</span>
            <div class="ts-tie-note" style="padding:20px;font-size:10px">${reason}</div>
            <button class="ts-next-btn" id="tsBack">LOBBYƏ QAYIT</button>
        </div>`;
    $("tsBack").addEventListener("click", () => {
        timestopView.classList.add("hidden");
        lobbyView.classList.remove("hidden");
        waitingScreen.classList.remove("hidden");
        joinScreen.classList.add("hidden");
    });
}

function renderLastStanding(name, reason) {
    timestopView.innerHTML = `
        <div class="ts-wrap" style="margin-top:80px">
            <span class="ts-eyebrow">OYUN BİTDİ</span>
            <div class="ts-winner-box ${name===S.myName?"ts-winner-self":""}">
                <div class="ts-winner-crown">👑</div>
                <div class="ts-winner-name">${name}</div>
                <div class="ts-winner-sub">SON QALAN — QALİB</div>
            </div>
            <div class="ts-tie-note" style="margin-top:16px;font-size:9px">${reason}</div>
            <button class="ts-next-btn" id="tsBack" style="margin-top:16px">LOBBYƏ QAYIT</button>
        </div>`;
    $("tsBack").addEventListener("click", () => {
        timestopView.classList.add("hidden");
        lobbyView.classList.remove("hidden");
        waitingScreen.classList.remove("hidden");
        joinScreen.classList.add("hidden");
    });
}

/* ════════════════════════════════════════════════════════════
   SOLO MODE (offline antrenman)
════════════════════════════════════════════════════════════ */
let soloState = { round: 0, score: 0, winScore: 3 };

function startSoloMode() {
    soloState = { round: 0, score: 0, winScore: S.winScore || 3 };
    S.players  = [{ name: S.myName || "Player", score: 0 }];
    S.winScore = soloState.winScore;
    S.isHost   = true;
    lobbyView.classList.add("hidden");
    timestopView.classList.remove("hidden");
    startSoloRound();
}

function startSoloRound() {
    soloState.round += 1;
    S.round   = soloState.round;
    S.target  = parseFloat((2 + Math.random() * 7.99).toFixed(2));
    S.running = false;
    S.elapsed = 0;
    S.players[0].score = soloState.score;

    renderRound();

    // Override stop — solo'da socket yok
    const selfBtn = document.querySelector(".ts-btn-self");
    if (selfBtn) {
        selfBtn.replaceWith(selfBtn.cloneNode(true)); // listener'ı temizle
        document.querySelector(".ts-btn-self")
            .addEventListener("click", () => soloStop());
    }

    S.keyHandler = e => {
        if ((e.code === "Space" || e.code === "Enter") && S.running) {
            e.preventDefault();
            soloStop();
        }
    };
    document.addEventListener("keydown", S.keyHandler);

    S.startTime = performance.now();
    S.running   = true;

    (function loop(now) {
        if (!S.running) return;
        S.elapsed = (now - S.startTime) / 1000;
        S.rafId   = requestAnimationFrame(loop);
    })(performance.now());
}

function soloStop() {
    if (!S.running) return;
    S.running = false;
    document.removeEventListener("keydown", S.keyHandler);

    const elapsed = (performance.now() - S.startTime) / 1000;
    const diff    = Math.abs(elapsed - S.target);
    const perfect = diff < 0.05;
    const pts     = perfect ? 2 : 1;
    soloState.score += pts;
    S.players[0].score = soloState.score;

    const btn = document.querySelector(".ts-btn-self");
    if (btn) { btn.disabled=true; btn.classList.add("ts-stopped"); btn.innerHTML=stopSvg("check"); }
    const res = document.querySelector(`.ts-seat-result[data-res="${S.myName}"]`);
    if (res) { res.textContent=elapsed.toFixed(2)+"s"; res.classList.remove("hidden"); }

    setTimeout(() => {
        const isChamp = soloState.score >= soloState.winScore;
        if (isChamp) {
            renderFinal({ champion: S.myName, finalScores: [{ name: S.myName, score: soloState.score }] });
        } else {
            renderRoundResult({
                round:      S.round,
                target:     S.target,
                tied:       false,
                winner:     S.myName,
                isPerfect:  perfect,
                eliminated: null,
                results:    [{ name: S.myName, time: elapsed, diff, isPerfect: perfect }],
                scores:     [{ name: S.myName, score: soloState.score }],
                remaining:  [],
            });
            // Next button → startSoloRound zaten bağlı
        }
    }, 700);
}

/* ════════════════════════════════════════════════════════════
   SOLO BUTTON (waiting screen — offline)
   soloBtn socket event değil, direkt solo modu başlatır
   sadece tek kişi varsa gösterilir
════════════════════════════════════════════════════════════ */
soloBtn.addEventListener("click", () => {
    // Sunucuya solo gönder; sunucu yoksa offline solo başlat
    if (socket.connected) {
        socket.emit("room:solo", { code: S.roomCode });
    } else {
        startSoloMode();
    }
}, { once: false });

   INIT
════════════════════════════════════════════════════════════ */
loadSavedName();
lucide.createIcons();
chatPanel.classList.add("hidden-chat"); // başta gizli — odaya girince açılır
</script>
